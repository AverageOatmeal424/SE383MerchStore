name: Build and test containers

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.401"
  MYSQL_ROOT_PASSWORD: BaKHQ5zr

jobs:
  unit-tests:
    name: xUnit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore Storefront.slnx

      - name: Build
        run: dotnet build Storefront.slnx -c Release --no-restore

      - name: Test item page
        run: dotnet test StorefrontUnitTest.csproj -c Release --no-build --verbosity normal
  
  #Deployment
  deployment:
      runs-on: ubuntu-latest
      environment: production
      steps:
        - name: deploy
          env:
            API_KEY: ${{ secrets.API_KEY }}
          run: echo "Running tests with staging secrets"
