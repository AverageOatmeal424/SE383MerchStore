version: '3.8'

services:
  app:
    build: .
    container_name: storefront-app
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Server=sql-server;User Id=sa;Password=${SA_PASSWORD};Database=Storefront;
    depends_on:
      sql-server:
        condition: service_healthy
    networks:
      - storefront-network

  sql-server:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: storefront-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${SA_PASSWORD}
    ports:
      - "1433:1433"
    healthcheck:
      test: [ "CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${SA_PASSWORD}", "-Q", "SELECT 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - storefront-network

networks:
  storefront-network:
    driver: bridge
